name: V5.8 verify actual branch
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-v52-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run voice:check && npm run voice:build && npm run build
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - run: python v5/browser_test.py
      - run: python v5/chat_browser_test.py
      - run: python v5/cloud_browser_test.py
      - run: python v5/library_browser_test.py
      - run: python v5/operations_browser_test.py
      - run: python v5/local_voice_browser_test.py --en v5/fixtures/synthetic-en.wav --zh v5/fixtures/synthetic-zh.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v58-browser-evidence
          path: |
            evidence/v5.8/
            evidence/v5.6/
          retention-days: 14
