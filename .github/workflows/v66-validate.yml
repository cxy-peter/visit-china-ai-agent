name: V6.6 related services and operator validation
on:
  push:
    branches: [upgrade/v6-6-services-operations, main]
  pull_request:
    paths: ['v5/**', 'api/products.js', 'docs/V6_6*', '.github/workflows/v66-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v66-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source-verified completion on feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/v6-6-services-operations'
        run: |
          if test -f .upgrade/complete-v66.py; then
            python3 .upgrade/complete-v66.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add v5/ .upgrade/
            git commit -m 'fix: visible pending review, consistent departure filters and retained state'
            git push origin HEAD:upgrade/v6-6-services-operations
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original model/prompt preservation
        run: node tools/verify-v65-preservation.cjs
      - name: Program and API regression
        run: |
          mkdir -p evidence/v6.6
          set -o pipefail
          npm test | tee evidence/v6.6/program-tests.log
      - run: npm run voice:check && npm run build
      - name: Browser setup
        run: |
          pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Related products, unified feedback and objective presets
        run: python v5/v66_browser_test.py
      - name: Five-city and previous interaction compatibility
        run: |
          python v5/v65_browser_test.py
          python v5/v65_compat_browser_test.py
      - name: Summarize actual acceptance
        run: |
          python - <<'PY'
          import json,re,pathlib,hashlib,subprocess,os,datetime
          root=pathlib.Path('.');out=root/'evidence/v6.6';log=(out/'program-tests.log').read_text()
          counts={k:int(re.search(r'^# '+k+r' (\d+)$',log,re.M).group(1)) for k in ['tests','pass','fail','skipped']}
          b=json.loads((out/'browser/report.json').read_text());assert b['checks'] and all(c['passed'] for c in b['checks']) and not b['errors']
          p=json.loads((root/'evidence/v6.5/prompt-preservation.json').read_text());assert p['passed']==p['total']
          compatibility={}
          for folder in ['browser','compat-browser']:
              report=json.loads((root/'evidence/v6.5'/folder/'report.json').read_text())
              assert report['checks'] and all(c['passed'] for c in report['checks']) and not report['errors']
              compatibility[folder]={'passed':sum(c['passed'] for c in report['checks']),'total':len(report['checks'])}
          result={'version':'6.6.0','testedCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'run':os.environ['GITHUB_RUN_ID'],'checkedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'program':counts,'browser':{'total':len(b['checks']),'passed':sum(c['passed'] for c in b['checks'])},'compatibility':compatibility,'promptPreservation':{'passed':p['passed'],'total':p['total']},'sourceHashes':{str(f):hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted((root/'v5').glob('*.js'))},'scope':'Development contracts, historical synthetic corpus, Chromium and local HTTP with controlled model responses. No new paid LLM, real microphone, supplier inventory, orders or production acceptance.'}
          (out/'acceptance.json').write_text(json.dumps(result,ensure_ascii=False,indent=2));(out/'prompt-preservation.json').write_text(json.dumps(p,ensure_ascii=False,indent=2));print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v66-validation-evidence
          path: |
            evidence/v6.6/
            evidence/v6.5/browser/
            evidence/v6.5/compat-browser/
            evidence/v6.5/prompt-preservation.json
          retention-days: 14
      - name: Verified public source
        if: success()
        run: git archive --format=tar HEAD | gzip > /tmp/visit-china-v66.tar.gz
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v66-verified-source
          path: /tmp/visit-china-v66.tar.gz
          retention-days: 7
