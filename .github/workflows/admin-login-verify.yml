name: Local admin login and preserved model contracts
on:
  push:
    branches: [fix/local-admin-login-and-skill-resume]
  pull_request:
    paths: ['v5/**','api/admin-login-info.js','tools/admin-login-browser-fixture.cjs','.github/workflows/admin-login-verify.yml']
permissions:
  contents: read
concurrency:
  group: admin-login-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrate verified edits on feature branch only
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/local-admin-login-and-skill-resume'
        run: |
          if test -f .upgrade/apply-admin-login.py; then
            python3 .upgrade/apply-admin-login.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add v5/server.js v5/build.js v5/index.html v5/ops.js .upgrade/
            git commit -m 'fix: integrate loopback-only admin prefill and consistent local authentication'
            git push origin HEAD:fix/local-admin-login-and-skill-resume
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Original prompt and model preservation
        run: node tools/verify-v65-preservation.cjs
      - name: Existing regression
        run: |
          mkdir -p evidence/admin-login
          set -o pipefail
          npm test | tee evidence/admin-login/existing-tests.log
      - name: New login contracts and full server HTTP
        run: |
          set -o pipefail
          node --test v5/admin-login.test.js v5/admin-server-login.test.js | tee evidence/admin-login/login-tests.log
      - run: npm run build
      - run: pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Actual input values, default/custom login and operator access
        run: python v5/admin-login-browser-test.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-login-verification
          path: |
            evidence/admin-login/
            evidence/v6.5/prompt-preservation.json
          retention-days: 14
