name: Import verified source bundle
on:
  push:
    paths:
      - '.bootstrap/manifest.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: source-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and unpack original UTF-8 source
        run: python3 .bootstrap/unpack.py
      - name: Run source tests and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run evaluate
          npm run build
      - name: Commit ordinary source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Publish verified V2 source and passing development checks'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: arrival-workspace-v2-standalone
          path: dist/
